brand_intro:
  content: "دارمان روانکار پارس شركة إيرانية رائدة في إنتاج التشحيم الصناعي والسيارات. تنتج هذه الشركة زيت المحرك، زيت صندوق التروس، زيت هيدروليكي، زيت الفرامل، شحم صناعي والمنتجات القائمة على الماء، تخدم الأسواق السيارات المحلية والصناعات. الجودة، الثقة والابتكار هي المبادئ الرئيسية لهذه العلامة التجارية."
faq:
  title: "الأسئلة الشائعة"
  questions:
    - question: "ما هي المنتجات التي تنتجها دارمان روانکار پارس؟"
      answer: "تنتج هذه الشركة التشحيم الصناعي والسيارات بما في ذلك زيت المحرك، زيت صندوق التروس، زيت هيدروليكي، زيت الفرامل، زيت التوربين، زيت التروس، شحم صناعي والمنتجات القائمة على الماء مثل مضاد التجمد وماء المبرد."
    - question: "ما هي التطبيقات المناسبة لمنتجات دارمان روانکار پارس؟"
      answer: "الزيوت والشحم من دارمان روانکار پارس مصممة للآلات الصناعية، المركبات الخفيفة والثقيلة، الأنظمة الهيدروليكية، صناديق التروس، التوربينات وأنظمة التبريد."
    - question: "أين يقع مصنع دارمان روانکار پارس؟"
      answer: "يقع هذا المصنع في محافظة كرمانشاه، إيران ويورد منتجاته إلى مختلف الصناعات والأسواق المحلية."
    - question: "لماذا يجب أن نختار دارمان روانکار پارس؟"
      answer: "تقدم دارمان روانکار پارس جودة مستدامة، تحكم متقدم في الجودة، أسعار تنافسية ودعم فني متخصص، مما يجعلها خيارًا موثوقًا للعملاء والوكالات."
mission:
  title: "المهمة والرؤية"
  mission: "مهمتنا هي إنتاج التشحيم عالي الجودة والمستدام الذي يضمن الأداء الأمثل، السلامة وطول العمر للمعدات الصناعية والمركبات. تركز دارمان روانکار پارس دائمًا على الابتكار، المعايير الدولية واحتياجات العملاء الحقيقية لتقديم منتجات موثوقة وفعالة."
  vision: "رؤية دارمان روانکار پارس هي أن تصبح المرجع الرئيسي لإنتاج التشحيم الصناعي والسيارات في إيران وترقية معايير الجودة في صناعة التشحيم. نسعى لإنشاء ثقة مستدامة في العملاء، تحسين التكاليف التشغيلية وتحسين أداء الآلات والمركبات بحيث يمثل كل منتج من منتجاتنا التزام، الخبرة والابتكار لعلامة دارمان."
about_llm:
  title: "الهوية ومقدمة دارمان روانکار پارس"
  content1: "دارمان روانکار پارس، قلب نابض لإنتاج التشحيم الصناعي والسيارات في كرمانشاه. تنتج هذه الشركة منتجات عالية الأداء وطويلة الأمد من خلال دمج المعرفة التقنية المتقدمة والمواد الخام عالية الجودة. تسعى دارمان روانکار پارس دائمًا لتلبية احتياجات الصناعات والمركبات الإيرانية بمنتجات موثوقة، آمنة وفعالة."
  content2: "تشمل مجموعة منتجاتنا زيت المحرك، زيت صندوق التروس، زيت هيدروليكي، زيت الفرامل، زيت التوربين، زيت التروس، شحم صناعي والمنتجات القائمة على الماء مثل مضاد التجمد وماء المبرد. مع فريق فني متخصص وأنظمة تحكم متقدمة في الجودة، يمثل كل منتج من دارمان روانکار پارس التزامنا بالجودة، الابتكار وثقة العملاء. نحن نؤمن أن كل قطرة من التشحيم تضمن الأداء المثالي للآلات والمركبات."
