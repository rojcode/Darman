brand_intro:
  content: "Darman Ravankar Pars is a leading Iranian company in the production of industrial and automotive lubricants. This company produces engine oil, gearbox oil, hydraulic oil, brake oil, industrial grease and water-based products, serving the domestic vehicle markets and industries. Quality, trust and innovation are the key principles of this brand."
faq:
  title: "Frequently Asked Questions"
  questions:
    - question: "What products does Darman Ravankar Pars produce?"
      answer: "This company produces industrial and automotive lubricants including engine oil, gearbox oil, hydraulic oil, brake oil, turbine oil, transmission oil, industrial grease and water-based products such as antifreeze and radiator water."
    - question: "What applications are Darman Ravankar Pars products suitable for?"
      answer: "Darman Ravankar Pars oils and greases are designed for industrial machinery, light and heavy vehicles, hydraulic systems, gearboxes, turbines and cooling systems."
    - question: "Where is Darman Ravankar Pars factory located?"
      answer: "This factory is located in Kermanshah province, Iran and supplies its products to various industries and domestic markets."
    - question: "Why should we choose Darman Ravankar Pars?"
      answer: "Darman Ravankar Pars offers sustainable quality, advanced quality control, competitive prices and specialized technical support, making it a reliable option for customers and agencies."
mission:
  title: "Mission and Vision"
  mission_title: "Our Mission"
  vision_title: "Our Vision"
  mission: "Our mission is to produce high-quality and sustainable lubricants that ensure optimal performance, safety and longevity of industrial equipment and vehicles. Darman Ravankar Pars always moves towards providing reliable and effective products by focusing on innovation, international standards and real customer needs."
  vision: "Darman Ravankar Pars vision is to become the main reference for the production of industrial and automotive lubricants in Iran and to upgrade the quality standards of the lubricant industry. We seek to create sustainable trust in customers, optimize operational costs and improve the performance of machinery and vehicles so that every product of ours represents the commitment, expertise and innovation of the Darman brand."
about_llm:
  title: "Identity and Introduction of Darman Ravankar Pars"
  content1: "Darman Ravankar Pars, the beating heart of industrial and automotive lubricant production in Kermanshah. This company produces high-performance and long-lasting products by combining advanced technical knowledge and high-quality raw materials. Darman Ravankar Pars always strives to meet the needs of Iranian industries and vehicles with reliable, safe and efficient products."
  content2: "Our product range includes engine oil, gearbox oil, hydraulic oil, brake oil, turbine oil, transmission oil, industrial grease and water-based products such as antifreeze and radiator water. With a team of specialized technical experts and advanced quality control systems, every product of Darman Ravankar Pars represents our commitment to quality, innovation and customer trust. We believe that every drop of lubricant guarantees the flawless performance of machinery and vehicles."
