brand_intro:
  content: "Darman Ravankar Pars - ведущая иранская компания по производству промышленных и автомобильных смазочных материалов. Производя моторное масло, масло для коробки передач, гидравлическое масло, тормозную жидкость, промышленную смазку и водные продукты, мы обслуживаем промышленность и внутренний рынок автомобилей. Качество, доверие и инновации - ключевые принципы этого бренда."
faq:
  title: "Часто Задаваемые Вопросы"
  questions:
    - question: "Какие продукты производит Darman Ravankar Pars?"
      answer: "Эта компания производит промышленные и автомобильные смазочные материалы, включая моторное масло, масло для коробки передач, гидравлическое масло, тормозную жидкость, турбинное масло, трансмиссионное масло, промышленную смазку и водные продукты, такие как антифриз и вода для радиатора."
    - question: "Для каких применений подходят продукты Darman Ravankar Pars?"
      answer: "Масла и смазки Darman Ravankar Pars предназначены для промышленного оборудования, легковых и грузовых автомобилей, гидравлических систем, коробок передач, турбин и систем охлаждения."
    - question: "Где находится завод Darman Ravankar Pars?"
      answer: "Этот завод расположен в провинции Керманшах, Иран, и поставляет свою продукцию различным отраслям и внутреннему рынку."
    - question: "Почему следует выбрать Darman Ravankar Pars?"
      answer: "Darman Ravankar Pars предлагает устойчивое качество, продвинутый контроль качества, конкурентные цены и специализированную техническую поддержку, что делает его надежным выбором для клиентов и представительств."
mission:
  title: "Миссия и Видение"
  mission_title: "Наша Миссия"
  vision_title: "Наше Видение"
  mission: "Наша миссия - производить качественные и устойчивые смазочные материалы, которые гарантируют оптимальную производительность, безопасность и долговечность промышленного оборудования и автомобилей. Darman Ravankar Pars, фокусируясь на инновациях, международных стандартах и реальных потребностях клиентов, всегда движется по пути предоставления надежных и эффективных продуктов."
  vision: "Видение Darman Ravankar Pars - стать основным центром производства промышленных и автомобильных смазочных материалов в Иране и повысить стандарты качества в отрасли смазочных материалов. Мы стремимся создать устойчивое доверие у клиентов, оптимизировать операционные затраты и улучшить производительность машин и автомобилей, чтобы каждый наш продукт представлял приверженность, экспертизу и инновации бренда Дарман."
about_llm:
  title: "Идентичность и Представление Darman Ravankar Pars"
  content1: "Darman Ravankar Pars - пульс производства промышленных и автомобильных смазочных материалов в Керманшахе. Комбинируя продвинутые технические знания и качественное сырье, мы производим продукты, гарантирующие высокую производительность и долговечность. Darman Ravankar Pars всегда стремится удовлетворять потребности иранской промышленности и автомобилей надежными, безопасными и эффективными продуктами."
  content2: "Наш ассортимент включает моторное масло, масло для коробки передач, гидравлическое масло, тормозную жидкость, турбинное масло, трансмиссионное масло, промышленную смазку и водные продукты, такие как антифриз и вода для радиатора. С командой специалистов и продвинутыми системами контроля качества, каждый продукт Darman Ravankar Pars представляет наше приверженство качеству, инновациям и доверию клиентов. Мы верим, что каждая капля смазочного материала гарантирует безупречную работу машин и автомобилей."
