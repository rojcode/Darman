brand_intro:
  content: "دارمان روانکار پارس یک شرکت ایرانی پیشرو در تولید روانکارهای صنعتی و خودرویی است. این شرکت با تولید روغن موتور، روغن گیربکس، روغن هیدرولیک، روغن ترمز، گریس صنعتی و محصولات پایه آب، به صنایع و بازار خودروهای داخلی خدمت می‌کند. کیفیت، اعتماد و نوآوری از اصول کلیدی این برند است."
faq:
  title: "سوالات متداول"
  questions:
    - question: "دارمان روانکار پارس چه محصولاتی تولید می‌کند؟"
      answer: "این شرکت تولیدکننده روانکارهای صنعتی و خودرویی شامل روغن موتور، روغن گیربکس، روغن هیدرولیک، روغن ترمز، روغن توربین، روغن ترانس، گریس صنعتی و محصولات پایه آب مانند ضد یخ و آب رادیاتور است."
    - question: "محصولات دارمان روانکار پارس برای چه کاربردهایی مناسب هستند؟"
      answer: "روغن‌ها و گریس‌های دارمان روانکار پارس برای ماشین‌آلات صنعتی، خودروهای سبک و سنگین، سیستم‌های هیدرولیک، گیربکس‌ها، توربین‌ها و سیستم‌های خنک‌کننده طراحی شده‌اند."
    - question: "کارخانه دارمان روانکار پارس کجاست؟"
      answer: "این کارخانه در استان کرمانشاه، ایران مستقر است و محصولات خود را به صنایع مختلف و بازار داخلی عرضه می‌کند."
    - question: "چرا باید دارمان روانکار پارس را انتخاب کنیم؟"
      answer: "دارمان روانکار پارس با کیفیت پایدار، کنترل کیفیت پیشرفته، قیمت رقابتی و پشتیبانی فنی تخصصی، گزینه‌ای قابل اعتماد برای مشتریان و نمایندگی‌ها است."
mission:
  title: "ماموریت و چشم‌انداز"
  mission: "ماموریت ما تولید روانکارهایی باکیفیت و پایدار است که عملکرد بهینه، ایمنی و طول عمر تجهیزات صنعتی و خودروها را تضمین می‌کنند. دارمان روانکار پارس با تمرکز بر نوآوری، استانداردهای بین‌المللی و نیاز واقعی مشتریان، همواره در مسیر ارائه محصولاتی قابل اعتماد و مؤثر حرکت می‌کند."
  vision: "چشم‌انداز دارمان روانکار پارس تبدیل شدن به مرجع اصلی تولید روانکارهای صنعتی و خودرویی در ایران و ارتقای استانداردهای کیفی صنعت روانکار است. ما به دنبال ایجاد اعتماد پایدار در مشتریان، بهینه‌سازی هزینه‌های عملیاتی و ارتقای عملکرد ماشین‌آلات و خودروها هستیم تا هر محصول ما نماینده تعهد، تخصص و نوآوری برند دارمان باشد."
about_llm:
  title: "هویت و معرفی دارمان روانکار پارس"
  content1: "دارمان روانکار پارس، قلب تپنده تولید روانکارهای صنعتی و خودرویی در کرمانشاه است. این شرکت با تلفیق دانش فنی پیشرفته و مواد اولیه باکیفیت، محصولاتی تولید می‌کند که عملکرد بالا و دوام طولانی را تضمین می‌کنند. دارمان روانکار پارس همواره در تلاش است تا نیازهای صنایع و خودروهای ایرانی را با محصولاتی قابل اعتماد، ایمن و کارآمد برآورده سازد."
  content2: "مجموعه محصولات ما شامل روغن موتور، روغن گیربکس، روغن هیدرولیک، روغن ترمز، روغن توربین، روغن ترانس، گریس صنعتی و محصولات پایه آب مانند ضد یخ و آب رادیاتور است. با تیم فنی متخصص و سیستم‌های کنترل کیفیت پیشرفته، هر محصول دارمان روانکار پارس نماینده تعهد ما به کیفیت، نوآوری و اعتماد مشتریان است. ما باور داریم که هر قطره روانکار، تضمین‌کننده عملکرد بی‌نقص ماشین‌آلات و خودروهاست."
